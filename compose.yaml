name: my-flowchart

services:
  my-flowchart:
    image: my-flowchart:${TAG:-latest}
    build:
      context: .
      args:
        # Hakkında modalındaki commit için: GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        GIT_COMMIT: ${GIT_COMMIT:-}
    environment:
      PORT: ${PORT:-8765}
    ports:
      - "${PORT:-8765}:${PORT:-8765}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
